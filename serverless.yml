# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: richarmamadi03
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: crud-cloud
# "service" is the name of this project. This will also be added to your AWS resource names.
service: cloud-computing-lab3

provider: 
  name: aws 
  runtime: nodejs24.x 
  architecture: arm64 
  region: us-east-1 
  environment: 
    PRODUCTOS_TABLE: ${self:service}-productos-${sls:stage} 
  iam: 
    role: 
      statements: 
        - Effect: Allow 
          Action: 
            - dynamodb:PutItem 
            - dynamodb:GetItem 
            - dynamodb:Scan 
            - dynamodb:UpdateItem 
            - dynamodb:DeleteItem 
          Resource: 
            - Fn::GetAtt: [ProductosTable, Arn]
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

functions: 
  crear: 
    handler: handler.crear 
    events: 
      - httpApi: 
          path: /productos 
          method: post 
  listar: 
    handler: handler.listar 
    events: 
      - httpApi: 
          path: /productos 
          method: get 
  obtener: 
    handler: handler.obtener 
    events: 
      - httpApi: 
          path: /productos/{id} 
          method: get 
  actualizar: 
    handler: handler.actualizar 
    events: 
      - httpApi: 
          path: /productos/{id} 
          method: put 
  eliminar: 
    handler: handler.eliminar 
    events: 
      - httpApi: 
          path: /productos/{id} 
          method: delete

resources: 
  Resources: 
    ProductosTable: 
      Type: AWS::DynamoDB::Table 
      Properties: 
        TableName: ${self:provider.environment.PRODUCTOS_TABLE} 
        BillingMode: PAY_PER_REQUEST 
        AttributeDefinitions: 
          - AttributeName: id 
            AttributeType: S 
        KeySchema: 
          - AttributeName: id 
            KeyType: HASH 

plugins:
  - serverless-offline
